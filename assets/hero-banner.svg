<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#070910"/>
    </linearGradient>

    <!-- Liquid Glass Prismatic Caustics (from user references) -->
    <radialGradient id="causticPurple" cx="20%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticCyan" cx="80%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticPink" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Button Fill Gradient -->
    <linearGradient id="liquidGlassPill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Rainbow Chromatic Edge Highlight -->
    <linearGradient id="chromaticBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Body -->
  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="24" fill="url(#causticPurple)"/>
  <rect width="1200" height="380" rx="24" fill="url(#causticCyan)"/>
  <rect width="1200" height="380" rx="24" fill="url(#causticPink)"/>

  <!-- Outer Glass Border -->
  <rect width="1198" height="378" x="1" y="1" rx="23" fill="none" stroke="url(#chromaticBorder)" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Centered Content -->
  <g text-anchor="middle">
    <!-- Top Pill: Status -->
    <g transform="translate(600, 48)">
      <rect x="-110" y="0" width="220" height="30" rx="15" fill="#1e293b" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#pillShadow)"/>
      <circle cx="-85" cy="15" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
      <text x="5" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">macOS NATIVE • v0.0.1</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
      FileShifter
    </text>

    <!-- Subtitle (English) -->
    <text x="600" y="188" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="22" font-weight="500" letter-spacing="-0.4">
      Gesture File Converter for macOS
    </text>

    <!-- Prompt (English) -->
    <text x="600" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="400">
      Just double-tap and hold
    </text>

    <!-- 4 Clean Liquid Glass Key Pills (Shift, Control, Command, Option) -->
    <g transform="translate(600, 260)" filter="url(#pillShadow)">
      <!-- Key 1: Shift -->
      <g transform="translate(-300, 0)">
        <rect x="0" y="0" width="135" height="52" rx="26" fill="url(#liquidGlassPill)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
        <rect x="1" y="1" width="133" height="25" rx="25" fill="#ffffff" fill-opacity="0.08"/>
        <text x="67" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">⇧ Shift</text>
      </g>

      <!-- Key 2: Control -->
      <g transform="translate(-145, 0)">
        <rect x="0" y="0" width="135" height="52" rx="26" fill="url(#liquidGlassPill)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.6"/>
        <rect x="1" y="1" width="133" height="25" rx="25" fill="#ffffff" fill-opacity="0.08"/>
        <text x="67" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">⌃ Control</text>
      </g>

      <!-- Key 3: Command -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="135" height="52" rx="26" fill="url(#liquidGlassPill)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
        <rect x="1" y="1" width="133" height="25" rx="25" fill="#ffffff" fill-opacity="0.08"/>
        <text x="67" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">⌘ Command</text>
      </g>

      <!-- Key 4: Option -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="135" height="52" rx="26" fill="url(#liquidGlassPill)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
        <rect x="1" y="1" width="133" height="25" rx="25" fill="#ffffff" fill-opacity="0.08"/>
        <text x="67" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">⌥ Option</text>
      </g>
    </g>
  </g>
</svg>
