<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="auto">
  <defs>
    <!-- Liquid Glass Card Fill Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Glass Caustic Highlights -->
    <radialGradient id="causticBlue" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="causticPurple" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="180" rx="20" fill="#090d16" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect width="1200" height="180" rx="20" fill="url(#causticBlue)"/>
  <rect width="1200" height="180" rx="20" fill="url(#causticPurple)"/>

  <!-- Card 1 -->
  <g transform="translate(30, 25)" filter="url(#cardShadow)">
    <rect width="265" height="130" rx="16" fill="url(#glassCard)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="1" y="1" width="263" height="40" rx="15" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="36" cy="36" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="36" y="42" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">1</text>
    <text x="24" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="600">
      <tspan x="24" dy="0">Выбери файл прямо</tspan>
      <tspan x="24" dy="24">в окне Finder</tspan>
    </text>
  </g>

  <!-- Connector Arrow 1-2 -->
  <path d="M 302 90 L 318 90" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="318,86 324,90 318,94" fill="#64748b"/>

  <!-- Card 2 -->
  <g transform="translate(330, 25)" filter="url(#cardShadow)">
    <rect width="265" height="130" rx="16" fill="url(#glassCard)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="1" y="1" width="263" height="40" rx="15" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="36" cy="36" r="16" fill="#ec4899" fill-opacity="0.2"/>
    <text x="36" y="42" fill="#ec4899" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">2</text>
    <text x="24" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="600">
      <tspan x="24" dy="0">Тапни дважды</tspan>
      <tspan x="24" dy="24">и удерживай клавишу</tspan>
    </text>
  </g>

  <!-- Connector Arrow 2-3 -->
  <path d="M 602 90 L 618 90" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="618,86 624,90 618,94" fill="#64748b"/>

  <!-- Card 3 -->
  <g transform="translate(630, 25)" filter="url(#cardShadow)">
    <rect width="265" height="130" rx="16" fill="url(#glassCard)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="1" y="1" width="263" height="40" rx="15" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="36" cy="36" r="16" fill="#a855f7" fill-opacity="0.2"/>
    <text x="36" y="42" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">3</text>
    <text x="24" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="600">
      <tspan x="24" dy="0">Сдвинь курсор</tspan>
      <tspan x="24" dy="24">на нужный сектор</tspan>
    </text>
  </g>

  <!-- Connector Arrow 3-4 -->
  <path d="M 902 90 L 918 90" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="918,86 924,90 918,94" fill="#64748b"/>

  <!-- Card 4 -->
  <g transform="translate(930, 25)" filter="url(#cardShadow)">
    <rect width="240" height="130" rx="16" fill="url(#glassCard)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="1" y="1" width="238" height="40" rx="15" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="36" y="42" fill="#10b981" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">4</text>
    <text x="24" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="15" font-weight="600">
      <tspan x="24" dy="0">Отпусти клавишу</tspan>
      <tspan x="24" dy="24">— действие готово ✓</tspan>
    </text>
  </g>
</svg>
